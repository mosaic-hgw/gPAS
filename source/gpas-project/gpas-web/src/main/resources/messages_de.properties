about.info                                                       = <h4>\u00DCber den gPAS</h4>\r\n\
  <p>Gro\u00dfe Forschungsverb\u00fcnde, die Durchf\u00fchrung klinisch-epidemiologischer Studien, aber auch der Aufbau von Registern und Kohorten, erfordern eine datenschutzkonforme Datenverarbeitung. Gem\u00e4\u00df Art. 32 Abs. 1a DSGVO unterst\u00fctzt die Verwendung von Pseudonymen dabei, ein angemessenes Schutzniveau der Datenverarbeitung zu gew\u00e4hrleisten.</p>\r\n<p>Zu diesem Zweck haben wir den gPAS\u00ae entwickelt. Dieser dient zur Generierung und Verwaltung von Pseudonymen. Das Dom\u00e4nenkonzept erm\u00f6glicht die strukturierte Verwaltung von Pseudonymen je Datenquelle, Anwendungskontext (Erhebung, Herausgabe) oder Standort. Dabei k\u00f6nnen die verwendeten Zeichen (Alphabet) und Algorithmen frei definiert werden. Die Verkn\u00fcpfung von Dom\u00e4nen erm\u00f6glicht den Aufbau von Hierarchien und die Generierung von Pseudonymen beliebiger Stufe (Pseudonymisieren von Pseudonymen). Die intuitive Benutzeroberfl\u00e4che unterst\u00fctzt bei typischen Aufgaben \u2013 auch bei der Verarbeitung gro\u00dfer Datenmengen per Listenverarbeitung. Das Dashboard liefert einen schnellen \u00dcberblick \u00fcber Zahlen zu bereits erzeugten Pseudonymen und konfigurierten Dom\u00e4nen. Einen schnellen und einfachen Einstieg erhalten Anwendende mit dem bereitgestellten Anwenderhandbuch, welches Schritt f\u00fcr Schritt durch die Funktionalit\u00e4ten und erforderlichen Konfigurationen leitet.</p>\r\n\r\n\
  <h4>Weitere Informationen</h4>\r\n\
  <p>Lizenz: <a href="https://www.gnu.org/licenses/agpl-3.0.de.html" target="_blank">AGPLv3</a><br/>\r\n\
  Copyright: 2013 - 2024 Unabh\u00E4ngige Treuhandstelle der Universit\u00E4tsmedizin Greifswald<br/>\r\n\
  Kontakt: <a href="https://www.ths-greifswald.de/kontakt/" target="_blank">Formular</a></p>\r\n\
  <p>Konzept und Implementation: Lars Geidel<br/>\r\nWeb-Client: Arne Blumentritt, Martin Bialke, Frank-Michael Moser<br/>\r\nDocker: Ronny Schuldt<br/>\r\nTTP-FHIR Gateway f\u00FCr gPAS: M. Bialke, P. Penndorf, L. Geidel, S. Lang</p>\r\n\r\n\
  <h4>Anwenderhandbuch</h4>\r\n<p>Die aktuellste Version des gPAS<sup>\u00AE</sup>-Handbuchs (Deutsch) finden Sie unter <a href="https://ths-greifswald.de/gpas/handbuch" target="_blank">https://ths-greifswald.de/gpas/handbuch</a>\r\n\
  <h4>API</h4>\r\n\
  <p>Alle Funktionalit\u00E4ten des gPAS<sup>\u00AE</sup> stehen f\u00FCr externe Anwendungen in Form einer SOAP-basierten Schnittstelle unter http://IP-ADDRESS:8080/gpas/gpasService?wsdl bereit. Sample-Requests sind im Anwenderhandbuch beschrieben. Die vollst\u00E4ndige Schnittstellenbeschreibung finden Sie unter <a href="https://ths-greifswald.de/gpas/doc" target="_blank">https://ths-greifswald.de/gpas/doc</a>.\r\n\
  <h4>Hinweis</h4>\r\n\
  <p>Der gPAS wurde von der Universit\u00E4tsmedizin Greifswald entwickelt (Institut f\u00FCr Community Medicine) und 2013 als Teil des MOSAIC Projektes ver\u00F6ffentlicht (gef\u00F6rdert durch die DFG HO 1937/2-1).<br/>\r\nAusgew\u00E4hlte Funktionen des gPAS<sup>\u00AE</sup> wurden im Rahmen der folgenden Vorhaben realisiert: \
  <ul>\
  <li>MIRACUM (gef\u00F6rdert durch das BMBF 01ZZ1801M)</li>\
  </ul></p>\r\n\
  <p>Bitte zitieren Sie unsere Publikationen:</p>\r\n\
  <ul>\r\n\
  <li><a href="https://dx.doi.org/10.3414/ME14-01-0133" target="_blank">https://dx.doi.org/10.3414/ME14-01-0133</a></li>\r\n\
  <li><a href="https://dx.doi.org/10.1186/s12967-015-0545-6" target="_blank">https://dx.doi.org/10.1186/s12967-015-0545-6</a></li>\r\n\
  </ul>
