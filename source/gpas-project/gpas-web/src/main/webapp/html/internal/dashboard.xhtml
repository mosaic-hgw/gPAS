<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:component="http://java.sun.com/jsf/composite/components"
	  xmlns:dashboard="http://java.sun.com/jsf/composite/components/dashboard"
	  xmlns:f="http://java.sun.com/jsf/core"
	  xmlns:h="http://java.sun.com/jsf/html"
	  xmlns:p="http://primefaces.org/ui"
	  xmlns:ui="http://java.sun.com/jsf/facelets">

<body>
<ui:composition template="/resources/templates/gpas.xhtml">

	<ui:define name="header_title">
		<h:outputText value="#{msg['page.dashboard.title']}" />
	</ui:define>

	<ui:define name="title">
		<h:outputText value="#{msg['page.dashboard.title']}" />
	</ui:define>

	<ui:define name="help">
		<h:outputText value="#{cmsg['welcome.help']}" escape="false" styleClass="desktop-only" />
		<h:outputText value="#{cmsg['welcome.help.mobile']}" escape="false" styleClass="mobile-only" />
	</ui:define>

	<ui:define name="content">
		<h:form id="main" onkeypress="return event.keyCode != 13">
			<p:panel rendered="#{empty domainController.domains}">
				<h:outputText value="#{msg['page.dashboard.noDomain']}" />
			</p:panel>
			<p:panel rendered="#{not empty domainController.domains and !dashboardController.hasStats}">
				<h:outputText value="#{msg['page.dashboard.empty']}" />
				<p:commandButton actionListener="#{dashboardController.updateStats}" icon="mdi mdi-refresh" styleClass="secondary" update="@form" value="#{cmsg['ui.button.refresh']}"
								 onclick="PF('loading').show()" oncomplete="PF('loading').hide()" />
			</p:panel>

			<div class="grid">
				<ui:fragment rendered="#{not empty domainController.domains and dashboardController.hasStats}">
					<div class="col-12 section-heading justify-content-between gap-3">
						<div class="flex align-items-center gap-3">
							<h:outputText value="#{cmsg['page.dashboard.statistic.statsFor']} #{cmsg['page.dashboard.domain.ALL']}" />
						</div>
					</div>
				</ui:fragment>

				<ui:fragment rendered="#{not empty domainController.domains and dashboardController.hasStatsInTimespan}">
					<!-- All domains -->
					<div class="col-12 md:col-7">
						<p:panel style="margin-bottom: 0">
							<div class="overview flex flex-wrap">
								<ui:repeat value="#{dashboardController.latestStatsAllDomainsLabels.entrySet()}" var="_stat" varStatus="_i">
									<div class="box">
										<div>
											<h:outputText styleClass="title block text-center" value="#{dashboardController.stats.mappedStatValue.get(_stat.key)}" />
											<h:outputText styleClass="details block text-center" value="#{_stat.value}" />
										</div>
										<p:divider layout="vertical" />
									</div>
								</ui:repeat>
								<div class="box">
									<div>
										<p:commandButton ajax="false" icon="mdi mdi-download" styleClass="secondary title block text-center" value="#{cmsg['page.dashboard.export.current']}">
											<p:fileDownload
													value="#{dashboardController.latestStatsAllDomains}" />
										</p:commandButton>
									</div>
									<p:divider layout="vertical" />
								</div>
								<div class="box">
									<p:outputPanel deferred="true" loaded="#{dashboardController.rangeStatsLoaded}" layout="block">
										<p:ajax event="load" listener="#{dashboardController.loadRangeStats}" ignoreAutoUpdate="true" />
										<f:facet name="loading">
											<p:skeleton shape="rectangle" width="105px" height="68px" />
										</f:facet>
										<p:commandButton ajax="false" icon="mdi mdi-download" styleClass="secondary title block text-center" value="#{cmsg['page.dashboard.export.history']}">
											<p:fileDownload
													value="#{dashboardController.historyStatsAllDomains}" />
										</p:commandButton>
									</p:outputPanel>
								</div>
							</div>
						</p:panel>
					</div>

					<!-- Meta -->
					<div class="col-12 md:col-5">
						<p:panel styleClass="h-full">
							<div class="overview flex flex-wrap">
								<div class="box">
									<div>
										<h:outputText styleClass="title block text-center"
													  value="#{dashboardController.latestStatsCalculationTime == -1 ? '-' : webUtil.showTimeInAutoFormat(dashboardController.latestStatsCalculationTime)}" />
										<h:outputText styleClass="details block text-center" value="#{cmsg['page.dashboard.meta.calculation']}" />
									</div>
									<p:divider layout="vertical" />
								</div>
								<div class="box">
									<div>
										<p:commandButton icon="mdi mdi-calendar-clock-outline" process="@this" onclick="PF('date_dialog').show();"
														 style="margin: -5px auto 0 auto; padding-bottom: 4px" styleClass="title block text-center secondary"
														 value="#{cmsg['page.dashboard.meta.latestDateTime']}" />
										<h:outputText styleClass="details block text-center z-1 text-xs" style="margin-bottom: -20px" value="#{dashboardController.latestStatsDateTimeString}" />
									</div>
									<p:divider layout="vertical" />
								</div>
								<div class="box">
									<div>
										<p:commandButton actionListener="#{dashboardController.updateStats}" icon="mdi mdi-refresh" styleClass="secondary title block text-center" update="@form"
														 value="#{cmsg['ui.button.refresh']}" onclick="PF('loading').show();" oncomplete="PF('loading').hide();" />
									</div>
								</div>
							</div>
						</p:panel>
					</div>

					<!-- Pseudonyms -->
					<p:outputPanel styleClass="col-12 lg:col-7 xl:col-8" deferred="true" loaded="#{dashboardController.rangeStatsLoaded}" layout="block">
						<f:facet name="loading">
							<p:panel styleClass="h-full">
								<h:outputText value="#{msg['page.dashboard.pseudonyms.history']}" styleClass="font-bold block" style="margin-bottom: 20px" />
								<p:skeleton shape="rectangle" height="22px" width="500px" style="max-width: 100%;" />
								<div class="flex w-full" style="height: 470px">
									<p:skeleton shape="rectangle" width="35%" height="200px" styleClass="mt-3" />
									<div style="width: 65%">
										<p:skeleton shape="circle" styleClass="mx-auto"
													style="aspect-ratio: 1/1; width: initial !important; height: initial !important; max-height: 100%" />
									</div>
								</div>
							</p:panel>
						</f:facet>

						<dashboard:pie_chart
								download="#{dashboardController.getPieChartAsCsv(dashboardController.getPseudonymsChart(false), dashboardController.stats.entrydate, 'pseudonyms latest', dashboardController.tool)}"
								pieChartDesktop="#{dashboardController.getPseudonymsChart(false)}"
								pieChartMobile="#{dashboardController.getPseudonymsChart(true)}"
								title="#{msg['page.dashboard.pseudonyms']}"
								hint="#{msg['page.dashboard.pseudonyms.hint']}"
								height="470px"
								groupOtherDomains="#{dashboardController.groupOtherDomains}" />
					</p:outputPanel>

					<!-- Domain Utilization -->
					<div class="col-12 lg:col-5 xl:col-4">
						<p:panel styleClass="h-full">
							<h4>
								#{msg['page.dashboard.domains']}
							</h4>
							<h:outputText value="#{msg['page.dashboard.domains.hint']}" />
							<p:dataView var="_domain" value="#{dashboardController.domainsByUsage}" rows="8"
										currentPageReportTemplate="#{props.currentPageReport}"
										paginator="true"
										paginatorTemplate="#{props.paginatorTemplate}"
										paginatorPosition="bottom" layout="list"
										styleClass="no-header"
										style="margin: 15px -10px 0;">
								<p:dataViewListItem>
									<div style="height: 45px;">
										<h:outputText value="#{dashboardController.getDomainLabel(_domain)}" />
										<p:progressBar value="#{_domain.percentPsnsUsed}" labelTemplate="#{_domain.percentPsnsUsed} %" displayOnly="true" />
									</div>
								</p:dataViewListItem>
							</p:dataView>
						</p:panel>
					</div>

					<!-- Pseudonyms History -->
					<p:outputPanel styleClass="col-12" deferred="true" loaded="#{dashboardController.rangeStatsLoaded}" layout="block">
						<f:facet name="loading">
							<p:panel styleClass="h-full">
								<h:outputText value="#{msg['page.dashboard.pseudonyms.history']}" styleClass="font-bold block" style="margin-bottom: 20px" />
								<p:skeleton shape="rectangle" width="100%" height="400px" />
							</p:panel>
						</f:facet>

						<dashboard:line_chart
								download="#{dashboardController.getLineChartAsCsv(dashboardController.pseudonymsHistoryChart, 'pseudonyms history', dashboardController.tool)}"
								lineChart="#{dashboardController.pseudonymsHistoryChart}"
								title="#{msg['page.dashboard.pseudonyms.history']}"
								hint="#{msg['page.dashboard.pseudonyms.history.hint']}"
								height="400px"
								groupOtherDomains="#{dashboardController.groupOtherDomains}"
								showDeletedDomains="#{dashboardController.showDeletedDomains}"
								hasDeletedDomains="#{dashboardController.deletedDomains}" />
					</p:outputPanel>
				</ui:fragment>
			</div>
		</h:form>
		<component:dummy />
		<dashboard:range_dialog id="range_dialog_component" startDate="#{dashboardController.rangeStartDate}"
								endDate="#{dashboardController.rangeEndDate}"
								minDate="#{dashboardController.statsMinDate}"
								maxDate="#{dashboardController.statsDate}"
								dateChangeListener="#{dashboardController.onDateChange}"
								update=":main" />
		<dashboard:date_dialog date="#{dashboardController.statsDate}"
							   dateChangeListener="#{dashboardController.onDateChange}"
							   minDate="#{dashboardController.statsMinDate}"
							   maxDate="#{dashboardController.statsMaxDate}"
							   update=":main" />
		<!-- ${disclaimer.enable.start}
		<component:demo_disclaimer/>
		${disclaimer.enable.end} -->
	</ui:define>
</ui:composition>
</body>
</html>
